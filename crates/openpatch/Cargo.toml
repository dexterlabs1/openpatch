[package]
name = "openpatch"
version = "0.3.3"
edition = "2021"
license = "MIT AND GPL-3.0-or-later"
description = "An agent-controllable modular synthesizer in Rust"

[dependencies]
sha2 = "0.10.9"
openpatch-core = { path = "../openpatch-core" }
serde_json = "1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
tar = { version = "0.4.46", default-features = false }
zstd = { version = "0.14.3", default-features = false }
base64 = "0.22.1"
tempfile = "=3.27.0"
rtrb = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
