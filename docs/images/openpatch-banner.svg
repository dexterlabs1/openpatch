<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="228" viewBox="0 0 1200 228" role="img" aria-labelledby="title description">
  <title id="title">OpenPatch</title>
  <desc id="description">Patch sound, shape motion. A dark rack with original green and amber patch cable artwork.</desc>
  <defs>
    <linearGradient id="background" x2="0" y2="1">
      <stop stop-color="#272b2c"/>
      <stop offset="1" stop-color="#171b1c"/>
    </linearGradient>
    <radialGradient id="light">
      <stop stop-color="#53736a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#53736a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="brushed" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 1H4" stroke="#fff" stroke-opacity=".018"/>
    </pattern>
    <pattern id="rail" width="26" height="10" patternUnits="userSpaceOnUse">
      <rect x="9" y="3" width="8" height="3" rx="1.5" fill="#121616"/>
    </pattern>
  </defs>
  <rect width="1200" height="228" rx="10" fill="url(#background)"/>
  <rect width="1200" height="228" rx="10" fill="url(#brushed)"/>
  <ellipse cx="600" cy="114" rx="490" ry="170" fill="url(#light)"/>
  <g opacity=".8">
    <path d="M20 15H1180M20 213H1180" stroke="#454c4c" stroke-width="10"/>
    <path d="M20 10H1180M20 208H1180" stroke="#707976" stroke-opacity=".5"/>
    <rect x="20" y="10" width="1160" height="10" fill="url(#rail)"/>
    <rect x="20" y="208" width="1160" height="10" fill="url(#rail)"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M70 81C70 207 273 204 273 116" stroke="#000" stroke-opacity=".3" stroke-width="11" transform="translate(0 4)"/>
    <path d="M70 81C70 207 273 204 273 116" stroke="#365d51" stroke-width="9"/>
    <path d="M70 81C70 207 273 204 273 116" stroke="#8cbea7" stroke-width="5"/>
    <path d="M927 116C927 204 1130 207 1130 81" stroke="#000" stroke-opacity=".3" stroke-width="11" transform="translate(0 4)"/>
    <path d="M927 116C927 204 1130 207 1130 81" stroke="#775736" stroke-width="9"/>
    <path d="M927 116C927 204 1130 207 1130 81" stroke="#d5ac72" stroke-width="5"/>
  </g>
  <g fill="#202727" stroke="#99a5a0" stroke-width="2">
    <circle cx="70" cy="81" r="12"/><circle cx="273" cy="116" r="12"/>
    <circle cx="927" cy="116" r="12"/><circle cx="1130" cy="81" r="12"/>
  </g>
  <g fill="#1b2220" stroke="#8cbea7" stroke-width="3">
    <circle cx="70" cy="81" r="7"/><circle cx="273" cy="116" r="7"/>
  </g>
  <g fill="#27231d" stroke="#d5ac72" stroke-width="3">
    <circle cx="927" cy="116" r="7"/><circle cx="1130" cy="81" r="7"/>
  </g>
  <text x="600" y="119" text-anchor="middle" fill="#e9ece4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="600" letter-spacing="-2">OpenPatch</text>
  <text x="600" y="155" text-anchor="middle" fill="#9bab9f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" letter-spacing="3.5">PATCH SOUND. SHAPE MOTION.</text>
</svg>
