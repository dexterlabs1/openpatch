#op-language { --op-room:82; --op-bloom:1; --op-led:8px; font:400 13px/1.35 'Barlow',sans-serif; color-scheme:light dark; }
#op-language * { box-sizing:border-box; }
#op-language [hidden] { display:none!important; }
#op-language .op-window { --op-chrome:light-dark(#e5e3dc,#191d20); --op-chrome-ink:light-dark(#292c2a,#e1e3de); --op-seam:light-dark(#a7a89e,#454b4d); --op-base:light-dark(#d9d6c9,#343b3c); --op-ink:light-dark(#242c2b,#f0eee3); --op-muted:light-dark(#555f5b,#b6c2bc); --op-panel:color-mix(in srgb,var(--op-base) calc(20% + var(--op-room) * .8%),#0b1014); --op-copper:#db936c; --op-mint:#87ddbb; --op-blue:#8ccbdd; --op-lilac:#b7a6e3; background:#101619; color:var(--op-chrome-ink); overflow:hidden; border-radius:10px; border:1px solid var(--op-seam); }
#op-language [data-night=true] { --op-ink:#d9dfd7; --op-muted:#a5b4ab; --op-seam:#343e40; }
#op-language .op-toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:14px; padding:14px 18px; background:var(--op-chrome); border-bottom:1px solid var(--op-seam); }
#op-language .op-logo { font-weight:600; font-size:18px; letter-spacing:-.5px; margin-right:9px; }
#op-language .op-wordmark { display:inline-flex; align-items:center; gap:8px; }
#op-language .op-logo-mark { width:18px; height:18px; border:1px solid currentColor; display:inline-block; border-radius:50%; box-shadow:inset 0 0 0 4px var(--op-chrome); background:currentColor; }
#op-language .op-project { color:var(--op-muted); margin-left:auto; }
#op-language .op-button { border:1px solid var(--op-seam); color:var(--op-chrome-ink); background:var(--op-chrome); border-radius:4px; min-height:32px; padding:6px 10px; font:500 12px 'Barlow',sans-serif; }
#op-language .op-button[aria-pressed=true] { background:var(--op-chrome-ink); color:var(--op-chrome); }
#op-language .op-subbar { display:flex; align-items:center; flex-wrap:wrap; justify-content:space-between; gap:14px; padding:12px 18px; background:var(--op-chrome); }
#op-language .op-study { font:400 11px 'IBM Plex Mono',monospace; letter-spacing:.5px; text-transform:uppercase; }
#op-language .op-room-control { display:flex; align-items:center; gap:10px; font-size:12px; }
#op-language .op-room-control input { width:95px; accent-color:var(--op-chrome-ink); }
#op-language .op-room-control output { font:400 11px 'IBM Plex Mono',monospace; min-width:31px; }
#op-language .op-rail { height:20px; background:repeating-linear-gradient(90deg,transparent 0 17px,#3c4447 17px 18px,transparent 18px 24px),linear-gradient(#20282c,#151c20); border-block:1px solid #41494a; box-shadow:inset 0 2px 5px #0009; }
#op-language .op-rack { display:grid; grid-template-columns:1.04fr .86fr .87fr 1.12fr 208px; position:relative; gap:0; background:#11181d; }
#op-language .op-module { min-width:0; height:440px; position:relative; color:var(--op-ink); background:linear-gradient(105deg,#ffffff07,transparent 50%),var(--op-panel); border-right:1px solid var(--op-seam); padding:22px 14px 16px; display:flex; flex-direction:column; transition:background .2s,color .2s; }
#op-language .op-module::before,#op-language .op-module::after { content:''; position:absolute; width:13px; height:4px; border:1px solid color-mix(in srgb,var(--op-ink) 40%,transparent); border-radius:4px; left:9px; background:linear-gradient(135deg,#ffffff20,#0004); }
#op-language .op-module::before { top:7px; }
#op-language .op-module::after { bottom:7px; }
#op-language .op-module-head { border-bottom:1px solid color-mix(in srgb,var(--op-ink) 20%,transparent); padding-bottom:13px; margin-bottom:14px; }
#op-language .op-module-meta { display:flex; align-items:center; justify-content:space-between; font:400 10px 'IBM Plex Mono',monospace; color:var(--op-muted); margin-bottom:4px; letter-spacing:.7px; }
#op-language .op-module-name { font-weight:600; font-size:23px; line-height:1.1; letter-spacing:-.7px; margin:0; }
#op-language .op-module-sub { font-size:11px; color:var(--op-muted); margin-top:4px; }
#op-language .op-led { width:var(--op-led); height:var(--op-led); display:inline-block; flex-shrink:0; border-radius:50%; background:var(--op-light,var(--op-mint)); box-shadow:0 0 2px #ffffe9,inset 0 0 3px #ffffc5,0 0 calc(8px * var(--op-bloom)) var(--op-light,var(--op-mint)),0 0 calc(22px * var(--op-bloom)) color-mix(in srgb,var(--op-light,var(--op-mint)) 75%,transparent),0 0 calc(38px * var(--op-bloom)) color-mix(in srgb,var(--op-light,var(--op-mint)) 22%,transparent); }
#op-language .op-control-bank { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); column-gap:8px; row-gap:14px; }
#op-language .op-dial { display:flex; flex-direction:column; align-items:center; gap:7px; min-width:0; }
#op-language .op-label { font:500 11px 'Barlow',sans-serif; letter-spacing:.5px; text-transform:uppercase; white-space:nowrap; }
#op-language .op-dial-face { width:51px; height:51px; position:relative; border-radius:50%; background:conic-gradient(from 225deg,var(--op-light) 0 var(--op-sweep),color-mix(in srgb,var(--op-ink) 15%,transparent) var(--op-sweep) 270deg,transparent 270deg); }
#op-language .op-dial-face::before { content:''; position:absolute; inset:4px; border-radius:50%; background:linear-gradient(135deg,#4c5656,#1e2628 65%); border:1px solid #11191c; box-shadow:inset 1px 1px 2px #ffffff4d,1px 3px 4px #0006; }
#op-language .op-dial-pointer { position:absolute; width:2px; height:14px; left:calc(50% - 1px); top:8px; background:#f2ead7; border-radius:2px; transform-origin:1px 17.5px; transform:rotate(var(--op-angle)); box-shadow:0 0 3px #ffffe844; }
#op-language .op-dial-face:focus-within { outline:2px solid var(--op-ink); outline-offset:4px; }
#op-language .op-dial input { position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:ew-resize; }
#op-language .op-value { font:400 11px 'IBM Plex Mono',monospace; white-space:nowrap; letter-spacing:-.25px; }
#op-language .op-scope { height:49px; width:100%; margin:0 0 15px; background:color-mix(in srgb,var(--op-ink) 6%,var(--op-panel)); border-radius:3px; padding:6px; display:block; }
#op-language .op-scope .op-axis { stroke:color-mix(in srgb,var(--op-ink) 12%,transparent); stroke-width:1; }
#op-language .op-scope .op-trace { stroke:var(--op-light); stroke-width:1.5; fill:none; filter:drop-shadow(0 0 2px color-mix(in srgb,var(--op-light) 50%,transparent)); }
#op-language .op-select { width:100%; margin-top:14px; min-height:29px; padding:4px 6px; border:1px solid color-mix(in srgb,var(--op-ink) 25%,transparent); border-radius:3px; color:var(--op-ink); background:var(--op-panel); font:400 11px 'Barlow',sans-serif; }
#op-language .op-ports { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px 4px; margin-top:auto; padding-top:16px; }
#op-language .op-port { display:flex; flex-direction:column; align-items:center; gap:5px; min-width:0; }
#op-language .op-jack { position:relative; width:25px; height:25px; border-radius:50%; background:radial-gradient(circle,#0a1014 0 25%,#7d8b89 28% 40%,#2b3535 44% 48%,#a2aaa3 51% 58%,#384443 64%); box-shadow:0 1px 2px #0008; display:block; }
#op-language .op-port-label { font:500 10px 'Barlow',sans-serif; letter-spacing:.3px; white-space:nowrap; }
#op-language .op-output .op-jack { box-shadow:0 0 0 2px var(--op-ink),0 0 0 4px var(--op-panel); }
#op-language .op-jack .op-led { position:absolute; width:5px; height:5px; right:-4px; top:-3px; }
#op-language .op-brand { font:500 9px 'IBM Plex Mono',monospace; letter-spacing:1.2px; text-align:center; color:var(--op-muted); padding-top:14px; }
#op-language .op-vendor-bay { height:440px; background:#11181d; display:flex; justify-content:center; position:relative; }
#op-language .op-vendor { width:208px; height:440px; flex-shrink:0; position:relative; }
#op-language .op-vendor-art { position:absolute; inset:0; filter:brightness(calc(.22 + var(--op-room) * .0078)); }
#op-language .op-vendor-art > .op-panel-art { width:100%; height:100%; display:block; }
#op-language .op-vendor-piece { position:absolute; }
#op-language .op-vendor-piece img { display:block; width:100%; height:100%; }
#op-language .op-vendor-piece img + img { position:absolute; inset:0; }
#op-language .op-vendor-light { position:absolute; width:5px; height:5px; border-radius:50%; background:#293c2d; }
#op-language .op-vendor-light.on { background:#a5f486; box-shadow:0 0 4px #a5f486,0 0 calc(12px * var(--op-bloom)) #73db64b3; }
#op-language .op-cables { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; z-index:3; opacity:.68; }
#op-language .op-cables path { fill:none; stroke-width:3.5; stroke-linecap:round; filter:drop-shadow(0 3px 2px #0009); }
#op-language .op-footer { display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px 22px; padding:12px 18px; background:var(--op-chrome); color:var(--op-chrome-ink); font-size:11px; }
#op-language .op-footer span { display:flex; align-items:center; gap:7px; }
#op-language .op-footer a { color:inherit; text-decoration:underline; text-underline-offset:3px; }
#op-language .op-console .op-module { background:linear-gradient(90deg,#ffffff04,transparent),var(--op-panel); padding-inline:12px; }
#op-language .op-console .op-module-head { display:flex; flex-direction:column; gap:4px; padding-bottom:11px; margin-bottom:12px; }
#op-language .op-console .op-module-name { font-size:20px; letter-spacing:1.2px; text-transform:uppercase; }
#op-language .op-console .op-module-meta { order:2; margin:0; }
#op-language .op-console .op-module-sub { display:none; }
#op-language .op-console .op-control-bank { display:flex; gap:8px; flex:1; align-items:stretch; justify-content:space-around; margin:4px 0 9px; }
#op-language .op-console .op-dial { flex:1; justify-content:space-between; max-width:52px; gap:9px; }
#op-language .op-console .op-label { writing-mode:vertical-rl; transform:rotate(180deg); height:65px; text-align:right; }
#op-language .op-console .op-dial-face { width:28px; height:116px; border-radius:3px; background:linear-gradient(90deg,transparent 12px,#121c20 12px 16px,transparent 16px),repeating-linear-gradient(0deg,var(--op-muted) 0 1px,transparent 1px 14px); }
#op-language .op-console .op-dial-face::before { display:none; }
#op-language .op-console .op-dial-pointer { width:26px; height:13px; left:1px; top:calc(97px - var(--op-position) * .84px); transform:none; background:linear-gradient(#7f8d88,#c3c9b9 40%,#6c7b73 44%,#263731 50%,#a5b1a2 57%,#738178); box-shadow:0 2px 3px #0009,inset 0 1px #ebefdc; border:1px solid #263c34; border-radius:2px; }
#op-language .op-console .op-scope { height:35px; margin-bottom:8px; }
#op-language .op-console .op-select { margin-top:0; }
#op-language .op-console .op-value { font-size:10px; letter-spacing:-.6px; }
@media(max-width:880px) { #op-language .op-rack { grid-template-columns:repeat(2,minmax(0,1fr)); } #op-language .op-module { border-bottom:1px solid var(--op-seam); } #op-language .op-cables { display:none; } #op-language .op-vendor-bay { grid-column:1/-1; } #op-language .op-control-bank { max-width:230px; align-self:center; width:100%; } #op-language .op-console .op-control-bank { max-width:100%; } #op-language .op-project { display:none; } }

@media(prefers-reduced-motion:reduce) { #op-language .op-module { transition:none; } }
</style>
