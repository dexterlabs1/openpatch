name: Build and test
on:
  # Validate the PR merge tree once; avoid push/PR/merge duplicates.
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
  workflow_dispatch:
    inputs:
      full_validation:
        description: 'Also validate Linux and Windows and run throughput benchmarks'
        type: boolean
        default: false
      release_validation:
        description: 'Validate and package macOS, Windows and Steam Deck without benchmarks'
        type: boolean
        default: false
      qualified_run:
        description: 'Reuse passed platform checks only for unchanged source and workflow/shader-EOL fixes'
        type: string
        default: ''
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  test:
    strategy:
      fail-fast: false
      # Release PRs qualify all requested platforms once; daily work targets Mac.
      matrix: ${{ fromJSON((inputs.full_validation || inputs.release_validation || startsWith(github.head_ref, 'work/release-')) && '{"include":[{"os":"macos-14","target":"aarch64-apple-darwin","artifact":"macos-arm64","binary":"openpatch"},{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","artifact":"linux-x86_64","binary":"openpatch"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc","artifact":"windows-x86_64","binary":"openpatch.exe"}]}' || '{"include":[{"os":"macos-14","target":"aarch64-apple-darwin","artifact":"macos-arm64","binary":"openpatch"}]}') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Identify Rust toolchain for cache
        shell: bash
        run: rustc -vV > rust-toolchain-cache-key.txt
      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-rust-${{ matrix.target }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain-cache-key.txt') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev xvfb
      - name: Verify reusable correctness evidence
        id: qualification
        shell: python
        env:
          QUALIFIED_RUN: ${{ inputs.qualified_run }}
          QUALIFIED_PLATFORM: ${{ matrix.artifact }}
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, pathlib, subprocess, urllib.request
          prior = os.environ.get("QUALIFIED_RUN", "")
          reuse = False
          if prior:
              assert prior.isdecimal(), "qualified_run must be a run ID"
              repository = os.environ["GITHUB_REPOSITORY"]
              def fetch(path):
                  request = urllib.request.Request(f"https://api.github.com/repos/{repository}/{path}", headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
                  with urllib.request.urlopen(request) as response:
                      return json.load(response)
              run = fetch(f"actions/runs/{prior}")
              assert run["event"] == "pull_request", "reuse requires the original PR correctness gate"
              source = run["head_sha"]
              changes = subprocess.check_output(["git", "diff", "--name-only", source, "HEAD"], text=True).splitlines()
              assert set(changes) <= {".github/workflows/ci.yml", ".gitattributes"}, f"runtime, package or test source changed: {changes}"
              if ".gitattributes" in changes:
                  assert pathlib.Path(".gitattributes").read_text() == "*.frag text eol=lf\n", "only canonical shader LF policy may reuse unchanged source"
              jobs = fetch(f"actions/runs/{prior}/jobs?per_page=100")["jobs"]
              platform = os.environ["QUALIFIED_PLATFORM"]
              matches = [job for job in jobs if platform in job["name"] and job["name"].startswith("test (")]
              assert len(matches) == 1, f"missing unique {platform} evidence"
              steps = {step["name"]: step.get("conclusion") for step in matches[0]["steps"]}
              reuse = all(steps.get(name) == "success" for name in ("Format check", "Clippy", "Rust correctness and allocation tests"))
              if platform == "windows-x86_64" and ".gitattributes" in changes:
                  reuse = False
              print(f"Prior PR run {prior} at {source}: {platform} reuse={reuse}; failed/unqualified checks run again")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("reuse=" + str(reuse).lower() + "\n")
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        if: steps.qualification.outputs.reuse != 'true'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust correctness and allocation tests
        if: steps.qualification.outputs.reuse != 'true'
        run: cargo test --locked --workspace
      - name: Release binary
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Native window and GLSL smoke test
        if: runner.os == 'Linux'
        run: |
          mkdir -p native-test-output
          timeout 45s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 target/${{ matrix.target }}/release/openpatch-desktop --smoke-test native-test-output/rack.png --workspace /tmp/openpatch-smoke
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: native-desktop-screenshot
          path: native-test-output/
      - name: Portable desktop package
        run: python scripts/package_release.py --platform ${{ matrix.artifact }} --binary-dir target/${{ matrix.target }}/release --output dist
      - name: Check packaged macOS signatures
        if: runner.os == 'macOS'
        run: |
          mkdir -p native-test-output/packaged-mac
          unzip -q dist/OpenPatch-macos-arm64.zip -d native-test-output/packaged-mac
          codesign --verify --deep --strict native-test-output/packaged-mac/OpenPatch-macos-arm64/OpenPatch.app
          native-test-output/packaged-mac/OpenPatch-macos-arm64/OpenPatch.app/Contents/MacOS/openpatch catalog > native-test-output/packaged-mac/catalog.json
      - name: Check packaged Windows executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive dist/OpenPatch-windows-x86_64.zip native-test-output/packaged-windows
          & native-test-output/packaged-windows/OpenPatch-windows-x86_64/openpatch.exe catalog | Out-File native-test-output/packaged-windows/catalog.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & native-test-output/packaged-windows/OpenPatch-windows-x86_64/openpatch-desktop.exe --third-party-licenses | Out-File native-test-output/packaged-windows/licenses.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check packaged Linux executables and user-space installation
        if: runner.os == 'Linux'
        run: |
          mkdir -p native-test-output/packaged-linux
          tar -xzf dist/OpenPatch-linux-x86_64.tar.gz -C native-test-output/packaged-linux
          native-test-output/packaged-linux/OpenPatch-linux-x86_64/openpatch catalog > native-test-output/packaged-linux/catalog.json
          HOME="$RUNNER_TEMP/openpatch-install" sh native-test-output/packaged-linux/OpenPatch-linux-x86_64/install.sh
          "$RUNNER_TEMP/openpatch-install/.local/share/openpatch/openpatch" patch-engine "Deep House" Dreamy Liquid --info
          ldd native-test-output/packaged-linux/OpenPatch-linux-x86_64/openpatch-desktop
      - name: Record package identity
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess
          info = {"commit": os.environ["GITHUB_SHA"], "tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(), "platform": "${{ matrix.artifact }}", "archives": {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path("dist").glob("OpenPatch-*") if p.is_file()}}
          pathlib.Path("dist/release-${{ matrix.artifact }}.json").write_text(json.dumps(info, indent=2) + "\n")
      - name: MCP integration tests
        env:
          OPENPATCH_BIN: target/${{ matrix.target }}/release/${{ matrix.binary }}
        run: python -m unittest discover -s scripts -v
      - name: Throughput benchmark
        if: inputs.full_validation
        run: cargo bench --locked -p openpatch-core
      - uses: actions/upload-artifact@v4
        with:
          name: openpatch-${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.binary }}
            target/${{ matrix.target }}/release/openpatch-desktop
            target/${{ matrix.target }}/release/openpatch-desktop.exe
            dist/OpenPatch-*.zip
            dist/OpenPatch-*.tar.gz
            dist/release-*.json
            Cargo.lock
            LICENSE
            README.md
      - name: Portable repository snapshot
        if: runner.os == 'Linux'
        run: git bundle create openpatch.bundle --all
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: repository-snapshot
          path: openpatch.bundle
  visualizer:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Browser integration
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/openpatch-http.log 2>&1 &
          node scripts/test_visualizer.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visualizer-screenshots
          path: visualizer-test-output/
