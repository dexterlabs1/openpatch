name: Build and test
on:
  # Validate the PR merge tree once; avoid push/PR/merge duplicates.
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
  workflow_dispatch:
    inputs:
      full_validation:
        description: 'Also validate Linux and Windows and run throughput benchmarks'
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      # Daily development targets the user's Mac. Other platforms are opt-in.
      matrix: ${{ fromJSON(inputs.full_validation && '{"include":[{"os":"macos-14","target":"aarch64-apple-darwin","artifact":"macos-arm64","binary":"openpatch"},{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","artifact":"linux-x86_64","binary":"openpatch"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc","artifact":"windows-x86_64","binary":"openpatch.exe"}]}' || '{"include":[{"os":"macos-14","target":"aarch64-apple-darwin","artifact":"macos-arm64","binary":"openpatch"}]}') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Identify Rust toolchain for cache
        shell: bash
        run: rustc -vV > rust-toolchain-cache-key.txt
      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-rust-${{ matrix.target }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain-cache-key.txt') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev xvfb
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust correctness and allocation tests
        run: cargo test --locked --workspace
      - name: Release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Native window and GLSL smoke test
        if: runner.os == 'Linux'
        run: |
          mkdir -p native-test-output
          timeout 45s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 target/${{ matrix.target }}/release/openpatch-desktop --smoke-test native-test-output/rack.png --workspace /tmp/openpatch-smoke
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: native-desktop-screenshot
          path: native-test-output/
      - name: macOS application bundle
        if: runner.os == 'macOS'
        run: |
          python3 scripts/package_macos.py --binary target/${{ matrix.target }}/release/openpatch-desktop
          ditto -c -k --sequesterRsrc --keepParent dist/OpenPatch.app dist/OpenPatch-macos-arm64.zip
      - name: MCP integration tests
        env:
          OPENPATCH_BIN: target/${{ matrix.target }}/release/${{ matrix.binary }}
        run: python -m unittest discover -s scripts -v
      - name: Throughput benchmark
        if: inputs.full_validation
        run: cargo bench --locked -p openpatch-core
      - uses: actions/upload-artifact@v4
        with:
          name: openpatch-${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.binary }}
            target/${{ matrix.target }}/release/openpatch-desktop
            target/${{ matrix.target }}/release/openpatch-desktop.exe
            dist/OpenPatch-macos-arm64.zip
            Cargo.lock
            LICENSE
            README.md
      - name: Portable repository snapshot
        if: matrix.os == 'ubuntu-latest'
        run: git bundle create openpatch.bundle --all
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: repository-snapshot
          path: openpatch.bundle
  visualizer:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Browser integration
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/openpatch-http.log 2>&1 &
          node scripts/test_visualizer.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visualizer-screenshots
          path: visualizer-test-output/
